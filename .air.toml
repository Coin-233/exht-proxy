root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  full_bin = "APP_ENV=dev ./tmp/main"
  
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "toml", "env"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", ".github", "build"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  
  delay = 200
  
  stop_on_error = true
  clear_on_rebuild = true
  kill_delay = "500ms"

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true