
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>加载中...</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
        
        .ui-bar { position: absolute; left: 0; width: 100%; background: rgba(30, 30, 35, 0.95); display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; box-sizing: border-box; z-index: 100; transition: transform 0.3s; backdrop-filter: blur(5px); }
        .header { top: 0; transform: translateY(-100%); border-bottom: 1px solid #444; }
        .footer { bottom: 0; transform: translateY(100%); border-top: 1px solid #444; justify-content: center; }
        .ui-bar.show { transform: translateY(0); }
        
        .btn { background: none; border: none; color: #f3f3f3; font-size: 16px; font-weight: bold; cursor: pointer; padding: 5px; }
        .page-counter { font-size: 15px; font-weight: bold; letter-spacing: 1px; }

        .viewer-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; touch-action: none; overflow: hidden; }
        .viewer-img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; transform-origin: center center; will-change: transform; }
        .page-track { position: absolute; inset: 0; will-change: transform; }
        .single-page { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
        .single-page.previous { left: -100%; right: 100%; }
        .single-page.next { left: 100%; right: -100%; }
        .single-page-status { color: #888; position: absolute; }
        .viewer-container.scroll-mode { touch-action: pan-x pan-y; }
        .scroll-mode .page-track { display: none; }
        .scroll-reader { display: none; position: absolute; inset: 0; overflow: auto; touch-action: pan-x pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
        .scroll-content { position: relative; width: calc(100% * var(--strip-scale, 1)); }
        .scroll-mode .scroll-reader { display: block; }
        .scroll-page { position: relative; width: 100%; max-width: calc(1100px * var(--strip-scale, 1)); margin: 0 auto; aspect-ratio: 7/10; background: #111; }
        .scroll-page img { display: block; width: 100%; height: 100%; object-fit: contain; }
        .scroll-page-status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #888; font-size: 14px; }
        .scroll-page-status button { background: #34353b; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 12px; cursor: pointer; }
        .scroll-mode .loader { position: fixed; top: 50%; left: 50%; margin: -24px 0 0 -24px; }
        .scroll-mode .error-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        @media (prefers-reduced-motion: reduce) {
            .ui-bar { transition: none; }
        }
        
        .loader { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #ed2553; border-radius: 50%; animation: spin 1s linear infinite; position: absolute; z-index: 10; box-shadow: 0 0 10px rgba(0,0,0,0.5); display: none; }
        .error-msg { position: absolute; color: #ed2553; text-align: center; padding: 20px; font-size: 14px; background: rgba(0,0,0,0.8); border-radius: 8px; display: none; z-index: 20; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .settings-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .settings-content { background: #2a2b2e; width: 85%; max-width: 400px; border-radius: 10px; padding: 20px; box-sizing: border-box; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .settings-content h3 { margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px; color: #fff; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .setting-row select { background: #1f2022; color: #fff; border: 1px solid #555; padding: 6px 10px; border-radius: 4px; font-size: 14px; outline: none; }
        .close-settings-btn { display: block; width: 100%; background: #ed2553; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="ui-bar header" id="header">
        <button class="btn" onclick="goBack()">❮ 返回</button>
        
        <div class="page-counter" id="pageMenuBtn" onclick="toggleMenu(event)" style="cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px; position:relative;">
            <span id="pageCounter">1 / -</span>
            <span id="menuArrow" style="transition: transform 0.3s ease; font-size: 10px; display:inline-block;">▼</span>
            
            <div id="viewerMenu" style="display:none; position:absolute; top:45px; left:50%; transform:translateX(-50%); background:rgba(40,40,42,0.95); border:1px solid #555; border-radius:12px; padding:5px; text-align:center; flex-direction:column; z-index: 2000; box-shadow: 0 4px 20px rgba(0,0,0,0.8); backdrop-filter: blur(5px); min-width: 130px;">
                <div onclick="downloadImage(event)" style="padding:12px; border-bottom:1px solid #444; color:#fff; font-size:14px;">下载图片</div>
                <div onclick="reloadImage(event)" style="padding:12px; border-bottom:1px solid #444; color:#fff; font-size:14px;">重载图片</div>
                <div onclick="loadOriginalImage(event)" style="padding:12px; color:#ed2553; font-weight:bold; font-size:14px;">查看原图</div>
            </div>
        </div>

        <button class="btn" onclick="openSettings()">⚙ 设置</button>
    </div>

    <div class="ui-bar footer" id="footer">
        <div style="font-size:12px; color:#aaa;" id="imgInfo">加载中...</div>
    </div>

    <div class="viewer-container" id="viewer">
        <div class="loader" id="loader"></div>
        <div class="error-msg" id="errorMsg"></div>
        <div class="page-track" id="pageTrack">
            <div class="single-page previous" id="previousPage" aria-hidden="true">
                <span class="single-page-status"></span>
                <img class="viewer-img" />
            </div>
            <div class="single-page"><img class="viewer-img" id="mainImg" /></div>
            <div class="single-page next" id="nextPage" aria-hidden="true">
                <span class="single-page-status"></span>
                <img class="viewer-img" />
            </div>
        </div>
        <div class="scroll-reader" id="scrollReader" aria-label="条漫阅读">
            <div class="scroll-content" id="scrollContent"></div>
        </div>
    </div>

    <div class="settings-modal" id="settingsModal" onclick="closeSettings(event)">
        <div class="settings-content" onclick="event.stopPropagation()">
            <h3>阅读器设置</h3>
            <div class="setting-row">
                <span>阅读方式</span>
                <select id="readingModeSelect" onchange="saveSettings()">
                    <option value="ltr">从左到右</option>
                    <option value="rtl">从右到左</option>
                    <option value="scroll">条漫</option>
                </select>
            </div>
            <div class="setting-row">
                <span>预加载页数</span>
                <select id="preloadSelect" onchange="saveSettings()">
                    <option value="1">1 页</option>
					<option value="2">2 页</option>
                    <option value="3">3 页</option>
					<option value="4">4 页</option>
                    <option value="5">5 页</option>
                </select>
            </div>
            <p style="font-size:12px; color:#888; text-align:center;" id="readingModeHint"></p>
            <button class="close-settings-btn" onclick="closeSettings(event, true)">完成</button>
        </div>
    </div>

    <script>
        const pathParts = window.location.pathname.split('/').filter(p => p);
        let gid = pathParts[1] || '';
        let token = pathParts[2] || '';
        
        let mpvUrl = '/mpv/' + gid + '/' + token + '/';
        let rawUrl = '/g/' + gid + '/' + token + '/';
        let returnUrl = '/m-view/' + gid + '/' + token + '/';

        let pageFromPath = parseInt(pathParts[3]) || 0;
        let currentPage = parseInt(pathParts[3]) || 1;

        let mpvkey = '';
        let imageList = []; 
        let galleryTitle = ''; 

        const savedReadingMode = localStorage.getItem('viewer_reading_mode');
        let config = {
            readingMode: ['ltr', 'rtl', 'scroll'].includes(savedReadingMode) ? savedReadingMode : 'ltr',
            preloadCount: parseInt(localStorage.getItem('viewer_preload')) || 3
        };

        function updateReadingModeHint() {
            const hints = {
                ltr: '左划或点击右侧进入下一页, 右划或点击左侧返回上一页. ',
                rtl: '右划或点击左侧进入下一页, 左划或点击右侧返回上一页. ',
                scroll: '图片上下连续排列, 轻触图片呼出菜单. '
            };
            document.getElementById('readingModeHint').textContent = hints[config.readingMode] + ' 双击放大, 再次双击还原';
        }

        function initSettings() {
            document.getElementById('readingModeSelect').value = config.readingMode;
            document.getElementById('preloadSelect').value = config.preloadCount;
            updateReadingModeHint();
        }

        function saveSettings() {
            const previousMode = config.readingMode;
            config.readingMode = document.getElementById('readingModeSelect').value;
            config.preloadCount = parseInt(document.getElementById('preloadSelect').value);
            localStorage.setItem('viewer_preload', config.preloadCount);
            localStorage.setItem('viewer_reading_mode', config.readingMode);
            updateReadingModeHint();
            if (previousMode !== config.readingMode) {
                changeReadingMode();
            } else if (config.readingMode === 'scroll') {
                observeScrollPages();
            } else {
                cancelPageAnimation();
                settleSingleTrack();
                triggerPreload();
            }
        }

        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings(e, force = false) {
            if (force || e.target.id === 'settingsModal') {
                document.getElementById('settingsModal').style.display = 'none';
            }
        }

        let uiVisible = false;

        function setUIVisible(visible) {
            uiVisible = visible;
            document.getElementById('header').classList.toggle('show', visible);
            document.getElementById('footer').classList.toggle('show', visible);

            if (!visible) {
                document.getElementById('viewerMenu').style.display = 'none';
                document.getElementById('menuArrow').style.transform = 'rotate(0deg)';
            }
        }

        function toggleUI() {
            setUIVisible(!uiVisible);
        }

        function toggleMenu(e) {
            if(e) e.stopPropagation();
            const menu = document.getElementById('viewerMenu');
            const arrow = document.getElementById('menuArrow');
            if (menu.style.display === 'none' || menu.style.display === '') {
                menu.style.display = 'flex';
                arrow.style.transform = 'rotate(180deg)';
            } else {
                menu.style.display = 'none';
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        async function downloadImage(e) {
            toggleMenu(e);
            const img = getCurrentImage();
            if (!img || !img.src) return;
            const page = currentPage;
            
            const infoEl = document.getElementById('imgInfo');
            const oldText = infoEl.innerText;
            infoEl.innerText = "正在打包下载...";
            
            try {
                const res = await fetch(img.src);
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = imageList[page - 1].n || ('image_' + page + '.jpg');
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
                if (currentPage === page) {
                    infoEl.innerText = "下载成功";
                    setTimeout(() => { if (currentPage === page) infoEl.innerText = oldText; }, 2000);
                }
            } catch (e) {
                if (currentPage === page) {
                    infoEl.innerText = "下载失败";
                    setTimeout(() => { if (currentPage === page) infoEl.innerText = oldText; }, 2000);
                }
            }
        }

        function reloadImage(e) {
            toggleMenu(e);
            const img = getCurrentImage();
            const loader = document.getElementById('loader');
            if (!img || !img.src) return;
            const page = currentPage;
            const isCurrent = () => currentPage === page && getCurrentImage() === img;
            
            loader.style.display = 'block';
            let urlObj;
            try {
                urlObj = new URL(img.src);
            } catch(e) {
                urlObj = new URL(img.src, window.location.origin);
            }
            urlObj.searchParams.set('_t', Date.now()); 
            
            const tmpImg = new Image();
            tmpImg.onload = () => {
                if (!isCurrent()) return;
                loader.style.display = 'none';
                img.src = urlObj.toString();
            };
            tmpImg.onerror = () => {
                if (!isCurrent()) return;
                loader.style.display = 'none';
                showError("重载失败，请检查网络");
            };
            tmpImg.src = urlObj.toString();
        }

        async function loadOriginalImage(e) {
            if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
        
            if (typeof toggleMenu === 'function') toggleMenu();

            const img = getCurrentImage();
            const infoEl = document.getElementById('imgInfo');
            const loader = document.getElementById('loader');
            
            if (!img || !imageList || !imageList[currentPage - 1]) return;
            const imgData = imageList[currentPage - 1];
            const page = currentPage;
            const isCurrent = () => currentPage === page && getCurrentImage() === img;
            
            loader.style.display = 'block';
            infoEl.innerText = "正在通过 API 获取原图...";
            
            try {
                const payload = {
                    method: "imagedispatch",
                    gid: parseInt(gid),
                    page: currentPage,
                    imgkey: imgData.k,
                    mpvkey: mpvkey
                };

                const res = await fetch('/api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!isCurrent()) return;
                
                if (data && data.lf) {
                    const targetUrl = window.location.origin + '/' + data.lf;
                    
                    infoEl.innerText = "原图拉取中...";
                    const tmpImg = new Image();
                    tmpImg.onload = () => {
                        if (!isCurrent()) return;
                        loader.style.display = 'none';
                        
                        let displayInfo = "";
                        if (data.o) {
                            displayInfo = data.o.replace(/^Download original\s+/, '').replace(/\s+source$/, '').trim();
                        } else {
                            displayInfo = tmpImg.width + " x " + tmpImg.height;
                        }
                        img.dataset.info = displayInfo + " :: 原图";
                        img.src = targetUrl;
                        infoEl.innerText = img.dataset.info;
                        
                        if (typeof resetZoom === 'function') resetZoom();
                    };
                    tmpImg.onerror = () => {
                        if (!isCurrent()) return;
                        loader.style.display = 'none';
                        infoEl.innerText = "加载原图失败，可能是配额或网络问题";
                    };
                    tmpImg.src = targetUrl;
                } else {
                    loader.style.display = 'none';
                    infoEl.innerText = "该图片未提供原图路径";
                }
            } catch (err) {
                if (!isCurrent()) return;
                loader.style.display = 'none';
                console.error(err);
                infoEl.innerText = "API 请求失败";
            }
        }

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else if (returnUrl) {
                window.location.replace(returnUrl);
            }
        }

        async function fetchMpvData() {
            if (!gid || !token) {
                showError("缺少 URL 参数! ");
                return;
            }

            try {
                const res = await fetch(mpvUrl);
                const text = await res.text();

                const titleMatch = text.match(/<title>(.*?)<\/title>/i);
                if (titleMatch) {
                    galleryTitle = titleMatch[1].replace(/ - ExHentai\.org$/i, '').trim();
                    document.title = galleryTitle;
                }

                const gidMatch = text.match(/var gid\s*=\s*(\d+)/);
                const mpvkeyMatch = text.match(/var mpvkey\s*=\s*"([^"]+)"/);
                const imagelistMatch = text.match(/var imagelist\s*=\s*(\[.*?\]);/);

                if (!gidMatch || !mpvkeyMatch || !imagelistMatch) {
                    showError("无法从页面提取 API 密钥, 该画廊可能不支持多页查看器.");
                    return;
                }

                gid = gidMatch[1];
                mpvkey = mpvkeyMatch[1];
                imageList = JSON.parse(imagelistMatch[1]); 

                goToPage(currentPage, false);
            } catch (err) {
                showError("初始化画廊数据失败: " + err.message);
            }
        }

        const imageRequests = new Map();
        function fetchImageUrl(page) {
            if (!imageRequests.has(page)) {
                const request = resolveImageUrl(page).finally(() => imageRequests.delete(page));
                imageRequests.set(page, request);
            }
            return imageRequests.get(page);
        }

        async function resolveImageUrl(page) {
            if (page < 1 || page > imageList.length) return null;
            let imgData = imageList[page - 1];
            
            if (imgData.url) return imgData;

            const payload = {
                method: "imagedispatch",
                gid: parseInt(gid),
                page: page,
                imgkey: imgData.k,
                mpvkey: mpvkey
            };

            try {
                const res = await fetch('/api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (data && data.i) {
                    imgData.url = data.i;
                    imgData.info = (data.d || "未知尺寸") + "  |  " + imgData.n;
                    return imgData;
                }
                return null;
            } catch (err) {
                return null;
            }
        }

        let loaderTimeout = null;
        let navigationID = 0;
        let displayedPage = 0;
        let pageAnimations = [];
        let finishPageTransition = null;
        let trackOffset = 0;
        const pageTrack = document.getElementById('pageTrack');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const scrollReader = document.getElementById('scrollReader');
        const scrollContent = document.getElementById('scrollContent');
        let scrollPages = [];
        let scrollObserver = null;
        let scrollFrame = null;
        let scrollTracking = false;

        function updatePageState(page) {
            currentPage = page;
            window.history.replaceState({}, '', '/viewer/' + gid + '/' + token + '/' + page + '/');
            document.getElementById('pageCounter').innerText = page + " / " + imageList.length;
            if (galleryTitle) document.title = galleryTitle + " " + page + "/" + imageList.length;
            const pageImg = config.readingMode === 'scroll' ? scrollPages[page - 1]?.querySelector('img') : null;
            document.getElementById('imgInfo').innerText = pageImg?.dataset.info || imageList[page - 1]?.info || "加载中...";
        }

        function setTrackOffset(offset) {
            trackOffset = offset;
            pageTrack.style.transform = 'translateX(' + offset + 'px)';
        }

        function cancelPageAnimation() {
            pageAnimations.forEach(animation => animation.cancel());
            pageAnimations = [];
            const finish = finishPageTransition;
            finishPageTransition = null;
            if (finish) finish();
        }

        function settleSingleTrack() {
            cancelPageAnimation();
            const start = trackOffset;
            setTrackOffset(0);
            if (!start || reducedMotion.matches) return;
            const animation = pageTrack.animate([
                { transform: 'translateX(' + start + 'px)' },
                { transform: 'translateX(0)' }
            ], { duration: 200, easing: 'ease-out' });
            pageAnimations = [animation];
            animation.onfinish = cancelPageAnimation;
        }

        function setNeighborImage(slot, page, data) {
            const neighborImg = slot.querySelector('img');
            const status = slot.querySelector('.single-page-status');
            slot.dataset.page = page;
            neighborImg.onload = () => {
                if (Number(slot.dataset.page) === page) status.textContent = '';
            };
            neighborImg.onerror = () => {
                if (Number(slot.dataset.page) === page) status.textContent = '图片加载失败';
            };
            neighborImg.src = data.url;
            neighborImg.style.display = 'block';
            if (neighborImg.complete && neighborImg.naturalWidth > 0) status.textContent = '';
        }

        function refreshSingleNeighbors() {
            if (config.readingMode === 'scroll' || !displayedPage) return;
            for (const [id, action] of [['previousPage', getHorizontalAction('left')], ['nextPage', getHorizontalAction('right')]]) {
                const slot = document.getElementById(id);
                const page = displayedPage + (action === 'next' ? 1 : -1);
                const neighborImg = slot.querySelector('img');
                const status = slot.querySelector('.single-page-status');
                if (Number(slot.dataset.page) === page && neighborImg.complete && neighborImg.naturalWidth > 0) continue;
                slot.dataset.page = page;
                neighborImg.style.display = 'none';
                neighborImg.removeAttribute('src');
                if (page < 1 || page > imageList.length) {
                    status.textContent = '';
                    continue;
                }
                status.textContent = '第 ' + page + ' 页 · 加载中…';
                fetchImageUrl(page).then(data => {
                    if (config.readingMode === 'scroll' || Number(slot.dataset.page) !== page) return;
                    if (data?.url) setNeighborImage(slot, page, data);
                    else status.textContent = '图片加载失败';
                });
            }
        }

        function applySingleImage(imgData, page, animate) {
            cancelPageAnimation();
            const imgEl = document.getElementById('mainImg');
            const previousPage = displayedPage;
            const requestID = navigationID;
            const finish = () => {
                if (requestID !== navigationID || config.readingMode === 'scroll') return;
                imgEl.src = imgData.url;
                delete imgEl.dataset.info;
                imgEl.style.display = 'block';
                imgEl.style.transform = 'none';
                displayedPage = page;
                setTrackOffset(0);
                document.getElementById('imgInfo').innerText = imgData.info;
                refreshSingleNeighbors();
            };
            if (!animate || !previousPage || Math.abs(page - previousPage) !== 1 || reducedMotion.matches) {
                finish();
                return;
            }
            const action = page > previousPage ? 'next' : 'prev';
            const direction = trackOffset !== 0 ? (trackOffset < 0 ? 1 : -1) : (getHorizontalAction('right') === action ? 1 : -1);
            setNeighborImage(document.getElementById(direction > 0 ? 'nextPage' : 'previousPage'), page, imgData);
            const destination = -direction * viewer.clientWidth;
            const start = trackOffset;
            // 只移动同一条图片轨道, 手指拖动和松手动画使用相同的位置
            setTrackOffset(destination);
            const animation = pageTrack.animate([
                { transform: 'translateX(' + start + 'px)' },
                { transform: 'translateX(' + destination + 'px)' }
            ], { duration: 260 * Math.max(0.25, Math.abs(destination - start) / viewer.clientWidth), easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
            finishPageTransition = finish;
            pageAnimations = [animation];
            animation.onfinish = cancelPageAnimation;
        }

        async function goToPage(page, animate = true) {
            if (!imageList.length) return;
            page = Math.max(1, Math.min(page, imageList.length));
            cancelPageAnimation();
            const requestID = ++navigationID;
            document.getElementById('viewerMenu').style.display = 'none';
            document.getElementById('menuArrow').style.transform = 'rotate(0deg)';
            clearTimeout(tapTimeout);
            resetZoom();
            clearTimeout(loaderTimeout);
            document.getElementById('loader').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'none';
            updatePageState(page);

            if (config.readingMode === 'scroll') {
                if (!scrollPages.length) buildScrollReader();
                scrollTracking = true;
                scrollReader.scrollTo({
                    top: scrollPages[page - 1].offsetTop,
                    behavior: animate && !reducedMotion.matches ? 'smooth' : 'instant'
                });
                loadScrollPage(page);
                return;
            }

            loaderTimeout = setTimeout(() => {
                if (requestID === navigationID) document.getElementById('loader').style.display = 'block';
            }, 50);
            const imgData = await fetchImageUrl(page);
            if (requestID !== navigationID || config.readingMode === 'scroll') return;
            if (!imgData || !imgData.url) {
                clearTimeout(loaderTimeout);
                settleSingleTrack();
                showError("图片加载失败, 可能是配额限制或网络错误. ");
                return;
            }
            const tmpImg = new Image();
            let applied = false;
            const applyImage = () => {
                if (applied || requestID !== navigationID || config.readingMode === 'scroll') return;
                applied = true;
                clearTimeout(loaderTimeout);
                document.getElementById('loader').style.display = 'none';
                applySingleImage(imgData, page, animate);
            };
            tmpImg.onload = applyImage;
            tmpImg.onerror = () => {
                if (requestID === navigationID) {
                    clearTimeout(loaderTimeout);
                    settleSingleTrack();
                    showError("图片资源获取成功, 但浏览器加载失败. ");
                }
            };
            tmpImg.src = imgData.url;
            if (tmpImg.complete && tmpImg.naturalWidth > 0) applyImage();
            triggerPreload();
        }

        function buildScrollReader() {
            const fragment = document.createDocumentFragment();
            scrollPages = imageList.map((data, index) => {
                const page = document.createElement('div');
                page.className = 'scroll-page';
                page.dataset.page = index + 1;
                const status = document.createElement('div');
                status.className = 'scroll-page-status';
                status.textContent = '第 ' + (index + 1) + ' 页 · 加载中…';
                page.appendChild(status);
                fragment.appendChild(page);
                return page;
            });
            scrollContent.replaceChildren(fragment);
            observeScrollPages();
        }

        function observeScrollPages() {
            if (scrollObserver) scrollObserver.disconnect();
            if (!scrollPages.length || config.readingMode !== 'scroll') return;
            scrollObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) loadScrollPage(Number(entry.target.dataset.page));
                });
            }, { root: scrollReader, rootMargin: (window.innerHeight * config.preloadCount) + 'px 0px' });
            scrollPages.forEach(page => scrollObserver.observe(page));
        }

        async function loadScrollPage(page, retry = false) {
            const wrapper = scrollPages[page - 1];
            if (!wrapper || wrapper.dataset.state === 'loading' || wrapper.dataset.state === 'loaded' || (wrapper.dataset.state === 'error' && !retry)) return;
            wrapper.dataset.state = 'loading';
            const status = wrapper.querySelector('.scroll-page-status');
            status.textContent = '第 ' + page + ' 页 · 加载中…';
            status.style.display = 'flex';
            if (retry) delete imageList[page - 1].url;
            const data = await fetchImageUrl(page);
            const failed = () => {
                wrapper.dataset.state = 'error';
                status.replaceChildren();
                const button = document.createElement('button');
                button.textContent = '第 ' + page + ' 页加载失败，点击重试';
                button.onclick = event => { event.stopPropagation(); loadScrollPage(page, true); };
                status.appendChild(button);
            };
            if (!data?.url) { failed(); return; }
            let pageImg = wrapper.querySelector('img');
            if (!pageImg) {
                pageImg = document.createElement('img');
                pageImg.alt = '第 ' + page + ' 页';
                pageImg.decoding = 'async';
                wrapper.prepend(pageImg);
            }
            pageImg.onload = () => {
                wrapper.style.aspectRatio = pageImg.naturalWidth + ' / ' + pageImg.naturalHeight;
                wrapper.dataset.state = 'loaded';
                status.style.display = 'none';
                if (config.readingMode === 'scroll' && currentPage === page) {
                    document.getElementById('imgInfo').innerText = pageImg.dataset.info || data.info;
                }
                scheduleScrollUpdate();
            };
            pageImg.onerror = failed;
            pageImg.src = data.url;
        }

        function scheduleScrollUpdate() {
            if (scrollFrame !== null || config.readingMode !== 'scroll' || !scrollTracking) return;
            scrollFrame = requestAnimationFrame(() => {
                scrollFrame = null;
                if (config.readingMode !== 'scroll' || !scrollPages.length) return;
                const position = scrollReader.scrollTop + scrollReader.clientHeight * 0.35;
                let low = 0, high = scrollPages.length - 1;
                while (low < high) {
                    const mid = Math.ceil((low + high) / 2);
                    if (scrollPages[mid].offsetTop <= position) low = mid;
                    else high = mid - 1;
                }
                if (currentPage !== low + 1) updatePageState(low + 1);
            });
        }
        scrollReader.addEventListener('scroll', scheduleScrollUpdate, { passive: true });
        window.addEventListener('resize', () => { observeScrollPages(); scheduleScrollUpdate(); });
        let stripScale = 1;
        let stripTapTime = 0;
        let stripTapX = 0;
        let stripTapY = 0;
        let stripTapTimeout = null;
        let scrollPointer = null;
        let stripZoomFrame = null;

        function cancelStripZoom() {
            if (stripZoomFrame !== null) cancelAnimationFrame(stripZoomFrame);
            stripZoomFrame = null;
        }

        function setStripZoom(nextScale, clientX, clientY, animate = true) {
            cancelStripZoom();
            const bounds = scrollReader.getBoundingClientRect();
            const x = clientX - bounds.left;
            const y = clientY - bounds.top;
            const initialScale = stripScale;
            const anchorX = (scrollReader.scrollLeft + x) / initialScale;
            const anchorY = (scrollReader.scrollTop + y) / initialScale;
            const applyScale = value => {
                stripScale = value;
                scrollReader.style.setProperty('--strip-scale', stripScale);
                // 每帧调整布局和滚动位置, 保持双击处的内容在原位置
                scrollReader.scrollTo({
                    left: anchorX * stripScale - x,
                    top: anchorY * stripScale - y,
                    behavior: 'instant'
                });
                scheduleScrollUpdate();
            };
            if (!animate || reducedMotion.matches || initialScale === nextScale) {
                applyScale(nextScale);
                return;
            }
            const started = performance.now();
            const step = now => {
                const progress = Math.min(1, (now - started) / 240);
                const eased = 1 - Math.pow(1 - progress, 3);
                applyScale(progress === 1 ? nextScale : initialScale + (nextScale - initialScale) * eased);
                stripZoomFrame = progress < 1 ? requestAnimationFrame(step) : null;
            };
            stripZoomFrame = requestAnimationFrame(step);
        }

        scrollReader.addEventListener('pointerdown', event => {
            cancelStripZoom();
            scrollPointer = { x: event.clientX, y: event.clientY, moved: false };
        });
        scrollReader.addEventListener('pointermove', event => {
            if (scrollPointer && Math.hypot(event.clientX - scrollPointer.x, event.clientY - scrollPointer.y) > 10) {
                scrollPointer.moved = true;
                clearTimeout(stripTapTimeout);
                stripTapTime = 0;
            }
        });
        scrollReader.addEventListener('pointercancel', () => {
            scrollPointer = null;
            clearTimeout(stripTapTimeout);
            stripTapTime = 0;
        });
        scrollReader.addEventListener('pointerup', event => {
            if (event.target.closest('button') || !scrollPointer || scrollPointer.moved) return;
            const now = Date.now();
            const samePosition = Math.hypot(event.clientX - stripTapX, event.clientY - stripTapY) < 35;
            if (now - stripTapTime < 300 && samePosition && event.target.closest('.scroll-page')?.dataset.state === 'loaded') {
                clearTimeout(stripTapTimeout);
                stripTapTime = 0;
                setStripZoom(stripScale > 1 ? 1 : 2.5, event.clientX, event.clientY);
            } else {
                stripTapTime = now;
                stripTapX = event.clientX;
                stripTapY = event.clientY;
                stripTapTimeout = setTimeout(toggleUI, 300);
            }
            scrollPointer = null;
        });

        function changeReadingMode() {
            cancelPageAnimation();
            cancelStripZoom();
            ++navigationID;
            clearTimeout(stripTapTimeout);
            stripTapTime = 0;
            if (stripScale !== 1) {
                setStripZoom(1, window.innerWidth / 2, window.innerHeight * 0.35, false);
            }
            setTrackOffset(0);
            clearTimeout(loaderTimeout);
            clearTimeout(tapTimeout);
            scrollTracking = false;
            viewer.classList.toggle('scroll-mode', config.readingMode === 'scroll');
            if (scrollObserver) scrollObserver.disconnect();
            goToPage(currentPage, false);
            if (config.readingMode === 'scroll') observeScrollPages();
        }

        function getCurrentImage() {
            return config.readingMode === 'scroll'
                ? scrollPages[currentPage - 1]?.querySelector('img')
                : document.getElementById('mainImg');
        }

        async function triggerPreload() {
            if (config.readingMode === 'scroll') return;
            refreshSingleNeighbors();
            for (let i = 1; i <= config.preloadCount; i++) {
                let targetPage = currentPage + i;
                if (targetPage <= imageList.length) {
                    fetchImageUrl(targetPage).then(data => {
                        if (data && data.url) {
                            new Image().src = data.url;
                        }
                    });
                }
            }
        }

        function showError(msg) {
            document.getElementById('loader').style.display = 'none';
            const err = document.getElementById('errorMsg');
            err.innerText = msg;
            err.style.display = 'block';
        }

        function handleTap(e) {
            if (isDragging) return;

            const width = window.innerWidth;
            const x = e.clientX;
            
            if (x < width * 0.3) {
                executeAction(getHorizontalAction('left'));
            } else if (x > width * 0.7) {
                executeAction(getHorizontalAction('right'));
            } else {
                toggleUI();
            }
        }

        function getHorizontalAction(side) {
            const nextSide = config.readingMode === 'rtl' ? 'left' : 'right';
            return side === nextSide ? 'next' : 'prev';
        }

        function getSwipeAction(deltaX) {
            return getHorizontalAction(deltaX < 0 ? 'right' : 'left');
        }

        function executeAction(action) {
            if (action === 'prev' && currentPage > 1) {
                goToPage(currentPage - 1);
            } else if (action === 'next' && currentPage < imageList.length) {
                goToPage(currentPage + 1);
            } else if (action === 'prev' && currentPage === 1) {
                setUIVisible(true);
            }
        }

        let scale = 1;
        let pointX = 0;
        let pointY = 0;
        let isDragging = false; 
        
        let initialPinchDistance = 0;
        let initialScale = 1;
        let lastTouchX = 0;
        let lastTouchY = 0;

        let touchStartTime = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        let hasMoved = false; 
        let swipeX = 0;
        let gesturePinched = false;
        let lastTapTime = 0;
        let tapTimeout = null;
        
        const viewer = document.getElementById('viewer');
        const img = document.getElementById('mainImg');

        function setTransform() {
            img.style.transform = 'translate(' + pointX + 'px, ' + pointY + 'px) scale(' + scale + ')';
        }

        function resetZoom() {
            scale = 1; pointX = 0; pointY = 0;
            img.style.transition = 'transform 0.2s ease'; 
            setTransform();
            setTimeout(() => { img.style.transition = 'none'; }, 200);
        }

        function getDistance(touches) {
            return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
        }

        function getMidpoint(touches) {
            return {
                x: (touches[0].clientX + touches[1].clientX) / 2,
                y: (touches[0].clientY + touches[1].clientY) / 2
            };
        }

        viewer.addEventListener('touchstart', (e) => {
            if (config.readingMode === 'scroll') return;
            if (e.touches.length === 1) {
                cancelPageAnimation();
                touchStartTime = Date.now();
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                hasMoved = false;
                swipeX = 0;
                gesturePinched = false;
                
                if (scale > 1) {
                    lastTouchX = e.touches[0].clientX;
                    lastTouchY = e.touches[0].clientY;
                    isDragging = false;
                }
            } else if (e.touches.length === 2) {
                clearTimeout(tapTimeout);
                gesturePinched = true;
                settleSingleTrack();
                e.preventDefault(); // 双指操作时阻止默认事件
                initialPinchDistance = getDistance(e.touches);
                initialScale = scale;
                const mid = getMidpoint(e.touches);
                lastTouchX = mid.x;
                lastTouchY = mid.y;
                isDragging = true; 
                hasMoved = true; 
            }
        }, { passive: false });

        viewer.addEventListener('touchmove', (e) => {
            if (config.readingMode === 'scroll') return;
            if (e.touches.length === 1) {
                // 滑动容差
                if (Math.abs(e.touches[0].clientX - touchStartX) > 10 || Math.abs(e.touches[0].clientY - touchStartY) > 10) {
                    hasMoved = true;
                    clearTimeout(tapTimeout);
                }
                
                if (scale > 1) {
                    e.preventDefault(); 
                    isDragging = true;
                    pointX += e.touches[0].clientX - lastTouchX;
                    pointY += e.touches[0].clientY - lastTouchY;
                    lastTouchX = e.touches[0].clientX;
                    lastTouchY = e.touches[0].clientY;
                    setTransform();
                } else if (scale === 1 && !gesturePinched) {
                    const dx = e.touches[0].clientX - touchStartX;
                    const dy = e.touches[0].clientY - touchStartY;
                    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
                        e.preventDefault();
                        swipeX = dx;
                        isDragging = true;
                        const action = getSwipeAction(dx);
                        const targetPage = displayedPage + (action === 'next' ? 1 : -1);
                        const atEdge = targetPage < 1 || targetPage > imageList.length;
                        setTrackOffset(atEdge ? dx * 0.25 : Math.max(-viewer.clientWidth, Math.min(viewer.clientWidth, dx)));
                    }
                }
            } else if (e.touches.length === 2) {
                e.preventDefault();
                isDragging = true;
                hasMoved = true;
                
                const currentDistance = getDistance(e.touches);
                const newScale = Math.min(Math.max(0.2, initialScale * (currentDistance / initialPinchDistance)), 5);
                const scaleRatio = newScale / scale;
                const mid = getMidpoint(e.touches);
                
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                
                pointX -= (mid.x - centerX - pointX) * (scaleRatio - 1);
                pointY -= (mid.y - centerY - pointY) * (scaleRatio - 1);
                
                pointX += (mid.x - lastTouchX);
                pointY += (mid.y - lastTouchY);
                
                scale = newScale;
                lastTouchX = mid.x;
                lastTouchY = mid.y;
                setTransform();
            }
        }, { passive: false });

        viewer.addEventListener('touchend', (e) => {
            if (config.readingMode === 'scroll') return;
            if (e.touches.length === 0) {
                const endTouch = e.changedTouches[0];
                const dx = endTouch ? endTouch.clientX - touchStartX : 0;
                const dy = endTouch ? endTouch.clientY - touchStartY : 0;
                const duration = Date.now() - touchStartTime;
                const swipeThreshold = Math.max(40, viewer.clientWidth * 0.12);
                if (scale === 1 && !gesturePinched && swipeX !== 0) {
                    e.preventDefault();
                    clearTimeout(tapTimeout);
                    lastTapTime = 0;
                    const committed = Math.abs(dx) > Math.abs(dy) && (Math.abs(dx) >= swipeThreshold || (duration < 250 && Math.abs(dx) > 24));
                    const swipeAction = getSwipeAction(dx);
                    const targetPage = displayedPage + (swipeAction === 'next' ? 1 : -1);
                    if (committed && targetPage >= 1 && targetPage <= imageList.length) {
                        goToPage(targetPage);
                    } else {
                        settleSingleTrack();
                    }
                } else if (scale < 1) {
                    resetZoom();
                } else if (!hasMoved && Date.now() - touchStartTime < 300) {
                    // 触发一次轻触
                    e.preventDefault(); 
                    let currentTime = Date.now();
                    
                    // 双击判定窗口 250 毫秒内连续敲击两下
                    if (currentTime - lastTapTime < 250) {
                        clearTimeout(tapTimeout);
                        
                        if (scale > 1) {
                            // 双击恢复默认
                            resetZoom();
                        } else {
                            // 双击放大到 2.5 倍并对准点击处
                            scale = 2.5;
                            const centerX = window.innerWidth / 2;
                            const centerY = window.innerHeight / 2;
                            
                            // 使双击的位置移动到屏幕中心
                            pointX = (centerX - touchStartX) * (scale - 1);
                            pointY = (centerY - touchStartY) * (scale - 1);
                            
                            img.style.transition = 'transform 0.2s ease';
                            setTransform();
                            setTimeout(() => { img.style.transition = 'none'; }, 200);
                        }
                        
                        lastTapTime = 0; 
                    } else {
                        lastTapTime = currentTime;
                        // 延迟 200ms 执行翻页 等待判断是否会发生双击
                        tapTimeout = setTimeout(() => {
                            handleTap({ clientX: touchStartX });
                        }, 200);
                    }
                }
                setTimeout(() => { isDragging = false; }, 50); 
            } else if (e.touches.length === 1 && scale > 1) {
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
            }
        });

        viewer.addEventListener('touchcancel', () => {
            clearTimeout(tapTimeout);
            isDragging = false;
            swipeX = 0;
            if (config.readingMode !== 'scroll') { resetZoom(); settleSingleTrack(); }
        });

        viewer.addEventListener('click', event => {
            if (config.readingMode !== 'scroll' && !('ontouchstart' in window)) handleTap(event);
        });
        window.addEventListener('keydown', event => {
            if (event.target.closest('select, input, button') || document.getElementById('settingsModal').style.display === 'flex') return;
            if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
                event.preventDefault();
                executeAction(getHorizontalAction(event.key === 'ArrowLeft' ? 'left' : 'right'));
            }
        });

        initSettings();
        viewer.classList.toggle('scroll-mode', config.readingMode === 'scroll');
        fetchMpvData();
    </script>
</body>
</html>
